<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1f24"/>
      <stop offset="50%" stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a95a5"/>
      <stop offset="50%" stop-color="#3d4450"/>
      <stop offset="100%" stop-color="#1e2229"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#E8400A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8400A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bgGrad)"/>
  
  <!-- Subtle Industrial Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
  </g>

  <!-- Orange Glow -->
  <circle cx="300" cy="350" r="280" fill="url(#orangeGlow)"/>

  <!-- Conveyor & Accessories Artwork -->
  <g transform="translate(300, 360)">
    <!-- Main Gear Base -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#metalGrad)" stroke-width="16" opacity="0.8"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="#E8400A" stroke-width="3" opacity="0.9" stroke-dasharray="12 8"/>
    <circle cx="0" cy="0" r="50" fill="#14171c" stroke="url(#metalGrad)" stroke-width="8"/>
    <circle cx="0" cy="0" r="20" fill="#E8400A"/>

    <!-- Gear Teeth -->
    <g stroke="url(#metalGrad)" stroke-width="14" stroke-linecap="round">
      <line x1="0" y1="-145" x2="0" y2="-130"/>
      <line x1="0" y1="130" x2="0" y2="145"/>
      <line x1="-145" y1="0" x2="-130" y2="0"/>
      <line x1="130" y1="0" x2="145" y2="0"/>
      <line x1="-102" y1="-102" x2="-91" y2="-91"/>
      <line x1="91" y1="91" x2="102" y2="102"/>
      <line x1="-102" y1="102" x2="-91" y2="91"/>
      <line x1="91" y1="-91" x2="102" y2="-102"/>
    </g>

    <!-- Technical Conveyor Belts -->
    <path d="M-220,120 L220,-120" stroke="url(#metalGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M-200,150 L240,-90" stroke="#E8400A" stroke-width="2" opacity="0.6"/>
    
    <!-- Accessories Blueprint Text & Crosshairs -->
    <circle cx="0" cy="0" r="210" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 4"/>
    <crosshair stroke="rgba(232,64,10,0.5)">
      <line x1="-240" y1="0" x2="240" y2="0" stroke="rgba(232,64,10,0.3)" stroke-width="1"/>
      <line x1="0" y1="-240" x2="0" y2="240" stroke="rgba(232,64,10,0.3)" stroke-width="1"/>
    </crosshair>
  </g>

  <!-- Technical Overlay Label -->
  <text x="50" y="70" font-family="'Oswald', sans-serif" font-size="20" font-weight="700" fill="#E8400A" letter-spacing="4">RIOPAK ACCESSORIES</text>
  <text x="50" y="95" font-family="'Inter', sans-serif" font-size="12" fill="rgba(255,255,255,0.4)" letter-spacing="2">CONVEYORS • FEEDERS • SYSTEMS</text>
</svg>
